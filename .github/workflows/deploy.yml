name: Build Web Image and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      api_replicas:
        description: API replicas
        required: false
        default: "2"
      web_replicas:
        description: Web replicas
        required: false
        default: "2"
      public_port:
        description: VM public port used by Docker Compose
        required: false
        default: "8080"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/testweb
  API_REPLICAS: ${{ github.event.inputs.api_replicas || '2' }}
  WEB_REPLICAS: ${{ github.event.inputs.web_replicas || '2' }}
  PUBLIC_PORT: ${{ github.event.inputs.public_port || '8080' }}
  VM_HOST: ${{ secrets.VM_HOST }}
  VM_USER: ${{ secrets.VM_USER }}
  VM_PORT: ${{ secrets.VM_PORT || '22' }}
  VM_APP_DIR: ${{ secrets.VM_APP_DIR || '/opt/testweb' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check deploy config
        id: deploy_config
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          if [ -z "$VM_HOST" ] || [ -z "$VM_USER" ] || [ -z "$VM_SSH_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "VM deploy skipped because VM_HOST, VM_USER or VM_SSH_KEY is missing."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Prepare SSH key
        if: steps.deploy_config.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          ssh-keyscan -p "$VM_PORT" "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Copy compose files
        if: steps.deploy_config.outputs.enabled == 'true'
        run: |
          ssh -i ~/.ssh/vm_key -p "$VM_PORT" "$VM_USER@$VM_HOST" "mkdir -p '$VM_APP_DIR/deploy'"
          scp -i ~/.ssh/vm_key -P "$VM_PORT" docker-compose.yml "$VM_USER@$VM_HOST:$VM_APP_DIR/docker-compose.yml"
          scp -i ~/.ssh/vm_key -P "$VM_PORT" deploy/edge.conf "$VM_USER@$VM_HOST:$VM_APP_DIR/deploy/edge.conf"

      - name: Deploy on VM
        if: steps.deploy_config.outputs.enabled == 'true'
        run: |
          ssh -i ~/.ssh/vm_key -p "$VM_PORT" "$VM_USER@$VM_HOST" "
            set -e
            cd '$VM_APP_DIR'
            if [ -n '${{ secrets.GHCR_TOKEN }}' ]; then
              echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u '${{ secrets.GHCR_USERNAME || github.repository_owner }}' --password-stdin
            fi
            printf '%s\n' \
              'API_IMAGE=ghcr.io/${{ github.repository_owner }}/testapi:latest' \
              'WEB_IMAGE=ghcr.io/${{ github.repository_owner }}/testweb:latest' \
              'PUBLIC_PORT=$PUBLIC_PORT' \
              > .env
            docker compose pull
            docker compose up -d --remove-orphans --scale api=$API_REPLICAS --scale web=$WEB_REPLICAS
            docker image prune -f
          "
