services:
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "${PUBLIC_PORT:-8080}:8080"
    volumes:
      - ./deploy/edge.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - testnet

  api:
    image: ${API_IMAGE:-ghcr.io/nsampini/testapi:latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Test
      ASPNETCORE_URLS: http://+:8080
    expose:
      - "8080"
    networks:
      - testnet

  web:
    image: ${WEB_IMAGE:-ghcr.io/nsampini/testweb:latest}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "8080"
    networks:
      - testnet

networks:
  testnet:
    name: testnet
